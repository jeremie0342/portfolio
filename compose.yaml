# The whole site on one machine: the server, its database, and the object
# store the console uploads to.
#
# Read docs/deployment.md before the first run. One value has to be decided
# there rather than here: the origin, which is baked into the build and cannot
# be corrected afterwards without building again.

name: zardonis

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zardonis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zardonis}
      # Stated rather than inherited. Postgres 18 moved the default data
      # directory inside its image, so a volume mounted where it used to be
      # would hold nothing and the data would live in the container, which
      # loses it at the next deployment without a word. Naming the location
      # makes the mount below correct whatever the image decides.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db:/var/lib/postgresql/data
    # No published port. The build stopped needing one when it stopped reading
    # the database, and pg_dump reaches it through `docker compose exec`, which
    # goes in the side rather than over the network. A port bound on the host
    # is one more thing that can already be taken by something else on a
    # machine that runs other projects.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zardonis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once per deployment, before the server starts, and exits. A schema
  # change that fails takes the deployment with it rather than leaving a server
  # talking to a database it does not match.
  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - media:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the bucket and opens it for reading. The objects are images meant
  # to be fetched by a browser from a public page; the keys are generated, so
  # nothing is guessable, and writing still requires the credentials.
  bucket:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set store http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing store/$$MINIO_BUCKET &&
      mc anonymous set download store/$$MINIO_BUCKET
      "

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL}
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CONSOLE_PATH: ${CONSOLE_PATH:?set CONSOLE_PATH}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?set MINIO_PUBLIC_URL}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db:
  media:
